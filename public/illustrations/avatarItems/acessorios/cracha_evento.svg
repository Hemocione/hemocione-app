<?xml version="1.0" encoding="UTF-8"?>
<!-- Event badge: a small chest credential on the shared avatar canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- A short shoulder connector keeps the smaller card attached without crossing the medal. -->
    <path d="M748 622 C754 654 762 680 770 704" fill="none" stroke="#152B45" stroke-width="12" />
    <path d="M748 622 C754 654 762 680 770 704" fill="none" stroke="#D71920" stroke-width="4" />

    <!-- The card sits partly over the torso, away from the hand and just clear of the medal. -->
    <rect x="760" y="700" width="95" height="140" rx="15" fill="#FFF9F2" stroke="#152B45" stroke-width="9" />
    <path d="M760 700 H855 V736 H760 Z" fill="#C62828" />
    <path d="M760 736 H855" stroke="#F9A825" stroke-width="7" />
    <circle cx="807" cy="766" r="21" fill="#FFF9F2" stroke="#152B45" stroke-width="5" />
    <path d="M807 773 C801 764 791 767 791 776 C791 785 807 793 807 793 C807 793 823 785 823 776 C823 767 813 764 807 773 Z" fill="#C62828" />
    <path d="M783 813 H831" stroke="#152B45" stroke-width="7" />
    <circle cx="807" cy="712" r="5" fill="#FFF9F2" />
  </g>
