<?xml version="1.0" encoding="UTF-8"?>
<!-- Event badge: a lanyard credential hanging below the blood-type medal. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- v2: short lanyard resting beside the medal on its left shoulder, not looping under it. Fable's review of v1 (straps arcing around the medal to a card at y 774) found the cord anatomically illogical - a real lanyard drops straight from the neck, it doesn't detour out and back - and the card sat low enough to read as belt height, not chest. Root fix: keep the whole necklace short and to one side, the same pattern that already worked for selo_liberado/fita_incentivo on the shoulders - no need to clear the medal by looping when it's simply not in the way. -->
    <path d="M585 545 Q550 575 500 600" fill="none" stroke="#152B45" stroke-width="12" />
    <path d="M585 545 Q550 575 500 600" fill="none" stroke="#D71920" stroke-width="5" />
    <path d="M615 548 Q595 578 560 600" fill="none" stroke="#152B45" stroke-width="12" />
    <path d="M615 548 Q595 578 560 600" fill="none" stroke="#D71920" stroke-width="5" />

    <rect x="455" y="600" width="140" height="78" rx="12" fill="#FFF9F2" stroke="#152B45" stroke-width="8" />
    <path d="M459 604 H591 V626 H459 Z" fill="#C62828" />
    <path d="M459 628 H591" stroke="#F9A825" stroke-width="6" />
    <circle cx="525" cy="654" r="16" fill="#FFF9F2" stroke="#152B45" stroke-width="4" />
    <path d="M525 661 C520 655 513 657 513 663 C513 670 525 676 525 676 C525 676 537 670 537 663 C537 657 530 655 525 661 Z" fill="#C62828" />
    <path d="M495 668 H555" stroke="#152B45" stroke-width="6" />
  </g>
</svg>
