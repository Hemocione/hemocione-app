<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- A short shoulder strap keeps the card away from the face and medal. -->
    <path d="M720 560 C735 604 765 632 798 660" fill="none" stroke="#152B45" stroke-width="18" />
    <path d="M720 560 C735 604 765 632 798 660" fill="none" stroke="#D71920" stroke-width="7" />

    <!-- A compact chest card, offset to the character's right and clear of the blood badge. -->
    <rect x="790" y="650" width="150" height="220" rx="22" fill="#FFF9F2" stroke="#152B45" stroke-width="13" />
    <path d="M790 650 H940 V716 H790 Z" fill="#C62828" />
    <path d="M790 716 H940" stroke="#F9A825" stroke-width="10" />
    <circle cx="865" cy="760" r="31" fill="#FFF9F2" stroke="#152B45" stroke-width="7" />
    <path d="M865 775 C857 762 840 765 840 779 C840 792 865 803 865 803 C865 803 890 792 890 779 C890 765 873 762 865 775 Z" fill="#C62828" />
    <path d="M826 828 H904" stroke="#152B45" stroke-width="9" />
    <path d="M842 848 H888" stroke="#8B9AAC" stroke-width="8" />
    <circle cx="865" cy="672" r="6" fill="#FFF9F2" />
  </g>
</svg>
